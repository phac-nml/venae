repository_type: pipeline

nf_core_version: 3.2.1

lint:
  files_unchanged:
    - .prettierignore
    - .github/CONTRIBUTING.md
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - .prettierignore
    - .github/CONTRIBUTING.md
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - .prettierignore
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-venae_logo_light.png
    - docs/images/nf-core-venae_logo_light.png
    - docs/images/nf-core-venae_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - process.cpus
    - process.memory
    - process.time
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-venae_logo_light.png
    - docs/images/nf-core-venae_logo_light.png
    - docs/images/nf-core-venae_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  readme:
    - nextflow_badge
  included_configs: false

template:
  org: phac-nml
  name: venae
  description: A workflow to rapidly identify species and antimicrobial resistance
    genes in positive blood cultures sequenced using Oxford Nanopore Technologies
    (ONT)
  author: nlermini
  version: 0.2.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - github_badges
    - nf_core_configs
    - rocrate
    - vscode
    - gitpod
    - codespaces
    - multiqc
    - fastqc
    - adaptivecard
    - slackreport
    - seqera_platform
  is_nfcore: false
