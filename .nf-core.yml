repository_type: pipeline

nf_core_version: 3.3.2

lint:
  files_unchanged:
    - .prettierignore
    - .github/CONTRIBUTING.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - docs/README.md
    - LICENSE
  nextflow_config:
    - process.cpus
    - process.memory
    - process.time
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
    - config_defaults:
        - params.db_dir
        - params.resource_dir
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-venae_logo_light.png
    - assets/email_template.txt
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/adaptivecard.json
    - assets/slackreport.json
    - docs/images/nf-core-venae_logo_light.png
    - docs/images/nf-core-venae_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - conf/test_full.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - ro-crate-metadata.json
    - assets/multiqc_config.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge
    - zenodo_release
  actions_awsfulltest: False
  actions_awstest: False
  multiqc_config: False
  template_strings:
    - modules/local/utils/main.nf
  merge_markers: False

template:
  org: phac-nml
  name: venae
  description: A workflow to rapidly identify species and antimicrobial resistance
    genes in positive blood cultures sequenced using Oxford Nanopore Technologies
    (ONT)
  author: nlermini
  version: 0.2.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - github_badges
    - nf_core_configs
    - rocrate
    - vscode
    - gitpod
    - codespaces
    - multiqc
    - fastqc
    - adaptivecard
    - slackreport
    - seqera_platform
  is_nfcore: false
